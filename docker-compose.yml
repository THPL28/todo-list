services:
  db:
    image: postgres:15
    env_file: .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-todo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-todo123}
      POSTGRES_DB: ${POSTGRES_DB:-todo}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-todo}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    command: sh -c "./entrypoint.sh"
    env_file: .env
    environment:
      DATABASE_HOST: db
      DATABASE_PORT: 5432
      EXTERNAL_NOTIFICATION_API_URL: http://notification-api:8001/notifications/
    depends_on:
      db:
        condition: service_healthy
      notification-api:
        condition: service_started
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app

  notification-api:
    build: ./notification_api
    ports:
      - "8001:8001"

  frontend:
    build: ./frontend
    env_file: .env
    ports:
      - "5173:5173"
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - /app/node_modules

volumes:
  db_data:
